<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trámite - Plataforma Participativa</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="styles.css">
    <!-- Scripts personalizados -->
    <script src="common.js" defer></script>
    <script src="tramite.js" defer></script>
</head>
<body>
    <!-- Encabezado y navegación se cargan desde common.js -->

    <main class="container mt-5">
        <!-- Sección del trámite -->
        <section id="tramite" class="bg-light p-4 rounded shadow-sm">
            <h2 class="text-center text-primary mb-4">Trámite Catastral</h2>
            <form id="formulario-tramite" class="needs-validation" novalidate>
                <!-- Campo: Cédula -->
                <div class="mb-3">
                    <label for="cedula" class="form-label">Cédula:</label>
                    <input type="text" id="cedula" name="cedula" class="form-control" placeholder="Ingrese su cédula" required>
                    <div class="invalid-feedback">Por favor, ingrese su cédula.</div>
                </div>

                <!-- Campo: Nombres y Apellidos -->
                <div class="mb-3">
                    <label for="nombres" class="form-label">Nombres y Apellidos:</label>
                    <input type="text" id="nombres" name="nombres" class="form-control" placeholder="Ingrese sus nombres y apellidos" required>
                    <div class="invalid-feedback">Por favor, ingrese sus nombres y apellidos.</div>
                </div>

                <!-- Campo: Teléfono -->
                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="Ingrese su teléfono" required>
                    <div class="invalid-feedback">Por favor, ingrese su número de teléfono.</div>
                </div>

                <!-- Campo: Correo Electrónico -->
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" class="form-control" placeholder="Ingrese su correo electrónico" required>
                    <div class="invalid-feedback">Por favor, ingrese un correo electrónico válido.</div>
                </div>

                <!-- Campo: Tipo de Trámite -->
                <div class="mb-3">
                    <label for="tipo-tramite" class="form-label">Tipo de Trámite:</label>
                    <select id="tipo-tramite" name="tipo-tramite" class="form-select" required>
                        <option value="">Seleccione una opción</option>
                        <option value="desenglobe">Desenglobe</option>
                        <option value="englobe">Englobe</option>
                        <option value="division">División</option>
                        <option value="fusion">Fusión</option>
                        <option value="modificacion">Modificación</option>
                    </select>
                    <div class="invalid-feedback">Por favor, seleccione un tipo de trámite.</div>
                </div>

                <!-- Campos adicionales (dinámicos) -->
                <div id="campos-adicionales" class="mb-3">
                    <!-- Los campos adicionales se agregarán dinámicamente con JavaScript -->
                </div>

                <!-- Botón de envío -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Enviar
                    </button>
                </div>

                <!-- Mensaje de éxito -->
                <div id="mensaje-exito" class="alert alert-success mt-4 d-none" role="alert">
                    ¡Formulario enviado exitosamente!
                </div>
            </form>
        </section>
    </main>

    <!-- Pie de página se carga desde common.js -->
</body>

<script>
    // Validaciones de Bootstrap
    (function () {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');

        Array.from(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                } else {
                    event.preventDefault(); // Simulación de envío
                    document.getElementById('mensaje-exito').classList.remove('d-none');
                }

                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
</html>
